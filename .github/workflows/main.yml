name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          if [ -f "Jarvis-oct-6-2026-10-55-36-am.zip" ]; then
            unzip -o Jarvis-oct-6-2026-10-55-36-am.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Executable
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK to Jarvis
        run: |
          mkdir -p output
          APK_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi
          cp "$APK_FILE" output/Jarvis.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis
          path: output/Jarvis.apk
